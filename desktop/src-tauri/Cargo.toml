[package]
name = "g-code-desktop"
version = "0.1.0"
description = "G-Code Desktop — AI Coding Agent GUI"
authors = ["Shadow Foundry"]
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "g_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros", "fs"] }
libc = "0.2"
base64 = "0.22"
portable-pty = "0.9"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
